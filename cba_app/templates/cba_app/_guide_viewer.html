{% if pdf_url %}
    <div class="guide-viewer table-wrapper" data-pdf-url="{{ pdf_url|escape }}" data-page="{{ page }}" data-pdf-version="{{ pdf_version|default:''|escape }}">
        <div class="notice notice--error" data-role="pdf-error" style="display:none;">
            No se pudo cargar el visor del libro. Usa “Abrir PDF” o verifica tu conexión.
        </div>

        <div class="notice notice--info" data-role="pdf-loading" style="display:none;">
            Cargando guía…
        </div>

        <div class="guide-flipbook" data-role="flipbook" aria-label="Libro digital"></div>

        <div class="guide-viewer__bottombar" aria-label="Controles de lectura">
            <button type="button" class="guide-viewer__icon" data-action="prev" aria-label="Páginas anteriores" title="Anterior">
                <svg viewBox="0 0 20 20" width="18" height="18" aria-hidden="true" focusable="false">
                    <path fill="currentColor" d="M12.7 4.3a1 1 0 0 1 0 1.4L9.4 9H17a1 1 0 1 1 0 2H9.4l3.3 3.3a1 1 0 1 1-1.4 1.4l-5-5a1 1 0 0 1 0-1.4l5-5a1 1 0 0 1 1.4 0z"/>
                </svg>
            </button>

            <div class="guide-viewer__page" aria-label="Estado de página">
                <span class="text-muted" data-role="page-indicator">Cargando…</span>

                <label for="guidePageInput" class="text-muted">Ir a</label>
                <input id="guidePageInput" type="number" class="guide-viewer__page-input" inputmode="numeric" min="1" step="1" data-role="page-input" aria-label="Ir a página">
                <span class="text-muted" data-role="page-count">/ —</span>
            </div>

            <div class="guide-viewer__slider" aria-label="Navegación rápida por páginas">
                <label for="guidePageSlider" class="text-muted">Página</label>
                <input id="guidePageSlider" type="range" min="1" max="1" value="1" step="1" data-role="page-slider" aria-label="Deslizar para ir a página">
            </div>

            <button type="button" class="guide-viewer__icon" data-action="next" aria-label="Páginas siguientes" title="Siguiente">
                <svg viewBox="0 0 20 20" width="18" height="18" aria-hidden="true" focusable="false">
                    <path fill="currentColor" d="M7.3 15.7a1 1 0 0 1 0-1.4L10.6 11H3a1 1 0 1 1 0-2h7.6L7.3 5.7a1 1 0 1 1 1.4-1.4l5 5a1 1 0 0 1 0 1.4l-5 5a1 1 0 0 1-1.4 0z"/>
                </svg>
            </button>

        </div>

        <div
            class="guide-viewer__actions-inline"
            aria-label="Acciones del visor"
            style="position:absolute; top:12px; right:12px; z-index:46; display:inline-flex; gap:8px; align-items:center; padding:6px 8px; border-radius:10px; border:1px solid rgba(15,23,42,.12); background:rgba(255,255,255,.9);"
        >
            <button type="button" class="guide-viewer__icon" data-action="fullscreen" aria-label="Pantalla completa" title="Pantalla completa">
                <svg viewBox="0 0 20 20" width="18" height="18" aria-hidden="true" focusable="false">
                    <path fill="currentColor" d="M3 7a1 1 0 0 0 1-1V4h2a1 1 0 1 0 0-2H3a1 1 0 0 0-1 1v3a1 1 0 0 0 1 1zm13-5h-3a1 1 0 1 0 0 2h2v2a1 1 0 1 0 2 0V3a1 1 0 0 0-1-1zM4 14v-2a1 1 0 1 0-2 0v3a1 1 0 0 0 1 1h3a1 1 0 1 0 0-2H4zm14-2a1 1 0 1 0-2 0v2h-2a1 1 0 1 0 0 2h3a1 1 0 0 0 1-1v-3z"/>
                </svg>
            </button>
            {% if open_url %}
                <a class="guide-viewer__icon" href="{{ open_url }}" target="_blank" rel="noopener" aria-label="Abrir PDF" title="Abrir PDF">
                    <svg viewBox="0 0 20 20" width="18" height="18" aria-hidden="true" focusable="false">
                        <path fill="currentColor" d="M11 3a1 1 0 0 1 1-1h5a1 1 0 0 1 1 1v5a1 1 0 1 1-2 0V5.4l-6.3 6.3a1 1 0 0 1-1.4-1.4L14.6 4H12a1 1 0 0 1-1-1z"/>
                        <path fill="currentColor" d="M4 4h5a1 1 0 1 1 0 2H5v10h10v-4a1 1 0 1 1 2 0v5a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V5a1 1 0 0 1 1-1z"/>
                    </svg>
                </a>
            {% endif %}
            {% if download_url %}
                <a class="guide-viewer__icon" href="{{ download_url }}" aria-label="Descargar" title="Descargar">
                    <svg viewBox="0 0 20 20" width="18" height="18" aria-hidden="true" focusable="false">
                        <path fill="currentColor" d="M10 2a1 1 0 0 1 1 1v7.6l2.3-2.3a1 1 0 1 1 1.4 1.4l-4 4a1 1 0 0 1-1.4 0l-4-4a1 1 0 1 1 1.4-1.4L9 10.6V3a1 1 0 0 1 1-1z"/>
                        <path fill="currentColor" d="M4 14a1 1 0 0 1 1 1v1h10v-1a1 1 0 1 1 2 0v2a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1v-2a1 1 0 0 1 1-1z"/>
                    </svg>
                </a>
            {% endif %}
        </div>

        <p class="guide-viewer__hint text-muted">Tip: clic en página izquierda/derecha o usa ← →. Home/End para inicio/fin.</p>

    </div>

    <script src="https://unpkg.com/pdfjs-dist@3.11.174/legacy/build/pdf.min.js" defer></script>
    <script src="https://unpkg.com/page-flip@2.0.7/dist/js/page-flip.browser.js" defer></script>
    <script>
        (function () {
            function onReady(fn) {
                if (document.readyState === 'complete' || document.readyState === 'interactive') fn();
                else document.addEventListener('DOMContentLoaded', fn);
            }

            function waitFor(predicate, tries, delayMs) {
                var remaining = typeof tries === 'number' ? tries : 30;
                var delay = typeof delayMs === 'number' ? delayMs : 120;
                return new Promise(function (resolve, reject) {
                    (function check() {
                        try {
                            if (predicate()) return resolve();
                        } catch (e) {
                            // ignore
                        }
                        remaining -= 1;
                        if (remaining <= 0) return reject(new Error('dependency not available'));
                        setTimeout(check, delay);
                    })();
                });
            }

            onReady(function () {
                var root = document.querySelector('.guide-viewer');
                if (!root) return;

                var pdfUrl = root.getAttribute('data-pdf-url') || '';
                var pdfVersion = String(root.getAttribute('data-pdf-version') || '').trim();
                var startPageFromServer = parseInt(root.getAttribute('data-page') || '1', 10);
                if (!Number.isFinite(startPageFromServer) || startPageFromServer < 1) startPageFromServer = 1;

                var fullscreenBtn = root.querySelector('[data-action="fullscreen"]');
                var book = root.querySelector('[data-role="flipbook"]');
                var errorBox = root.querySelector('[data-role="pdf-error"]');
                var loadingBox = root.querySelector('[data-role="pdf-loading"]');
                var bottomBarEl = root.querySelector('.guide-viewer__bottombar');

                var prevBtn = root.querySelector('[data-action="prev"]');
                var nextBtn = root.querySelector('[data-action="next"]');
                var pageInputEl = root.querySelector('[data-role="page-input"]');
                var pageCountEl = root.querySelector('[data-role="page-count"]');
                var pageIndicatorEl = root.querySelector('[data-role="page-indicator"]');
                var pageSliderEl = root.querySelector('[data-role="page-slider"]');
                var actionsInlineEl = root.querySelector('.guide-viewer__actions-inline');

                if (!book) return;
                if (!pdfUrl) {
                    if (errorBox) errorBox.style.display = 'block';
                    return;
                }

                var pdfDoc = null;

                function pinActionsTopRight() {
                    if (!actionsInlineEl) return;
                    actionsInlineEl.style.position = 'absolute';
                    actionsInlineEl.style.top = '12px';
                    actionsInlineEl.style.right = '12px';
                    actionsInlineEl.style.left = 'auto';
                    actionsInlineEl.style.bottom = 'auto';
                    actionsInlineEl.style.transform = 'none';
                    actionsInlineEl.style.zIndex = '46';
                    actionsInlineEl.style.display = 'inline-flex';
                    actionsInlineEl.style.flexDirection = 'row';
                }

                function applyBottomBarDocking() {
                    if (!bottomBarEl) return;
                    var wide = false;
                    try {
                        wide = !!(window.matchMedia && window.matchMedia('(min-width: 900px)').matches);
                    } catch (e) {
                        wide = false;
                    }
                    var fsActive = false;
                    try { fsActive = isFullscreenActive(); } catch (e) { fsActive = false; }

                    if (fsActive) {
                        // Fullscreen: barra compacta full-width pegada abajo
                        bottomBarEl.style.position = 'absolute';
                        bottomBarEl.style.left = '0';
                        bottomBarEl.style.right = '0';
                        bottomBarEl.style.bottom = '0';
                        bottomBarEl.style.zIndex = '40';
                        bottomBarEl.style.margin = '0';
                        bottomBarEl.style.padding = '3px 12px';
                        bottomBarEl.style.borderTop = '0';
                        bottomBarEl.style.borderRadius = '0';
                        bottomBarEl.style.background = 'rgba(255,255,255,.08)';
                        bottomBarEl.style.backdropFilter = 'none';
                    } else if (wide) {
                        bottomBarEl.style.position = 'absolute';
                        bottomBarEl.style.left = '10px';
                        bottomBarEl.style.right = '10px';
                        bottomBarEl.style.bottom = '6px';
                        bottomBarEl.style.zIndex = '40';
                        bottomBarEl.style.margin = '0';
                        bottomBarEl.style.padding = '8px 8px';
                        bottomBarEl.style.borderTop = '0';
                        bottomBarEl.style.borderRadius = '14px';
                        bottomBarEl.style.background = 'rgba(255,255,255,.82)';
                        bottomBarEl.style.backdropFilter = 'blur(4px)';
                    } else {
                        bottomBarEl.style.position = '';
                        bottomBarEl.style.left = '';
                        bottomBarEl.style.right = '';
                        bottomBarEl.style.bottom = '';
                        bottomBarEl.style.zIndex = '';
                        bottomBarEl.style.margin = '';
                        bottomBarEl.style.padding = '';
                        bottomBarEl.style.borderTop = '';
                        bottomBarEl.style.borderRadius = '';
                        bottomBarEl.style.background = '';
                        bottomBarEl.style.backdropFilter = '';
                    }
                }

                function scaleBookToFit() {
                    var stfParent = book ? book.querySelector('.stf__parent') : null;
                    if (!stfParent) return;
                    if (!isFullscreenActive()) {
                        stfParent.style.transform = '';
                        stfParent.style.transformOrigin = '';
                        return;
                    }
                    // Resetear transform antes de medir para obtener tamaño real
                    stfParent.style.transform = 'none';
                    // Forzar reflow
                    void stfParent.offsetWidth;
                    // Medir tamaño real que StPageFlip le asignó al wrapper
                    var stfWrapper = stfParent.querySelector('.stf__wrapper') || stfParent;
                    var pw = stfWrapper.offsetWidth || stfWrapper.clientWidth || 0;
                    var ph = stfWrapper.offsetHeight || stfWrapper.clientHeight || 0;
                    // Si wrapper no tiene tamaño, probar style inline de stf__parent
                    if (pw < 10 || ph < 10) {
                        pw = parseInt(stfParent.style.width, 10) || stfParent.offsetWidth || 0;
                        ph = parseInt(stfParent.style.height, 10) || stfParent.offsetHeight || 0;
                    }
                    console.log('[scaleBookToFit] pw=' + pw + ' ph=' + ph);
                    if (pw < 10 || ph < 10) { stfParent.style.transform = ''; return; }
                    // Espacio disponible: viewport menos margen para la barra inferior
                    var vw = window.innerWidth || document.documentElement.clientWidth || 0;
                    var vh = window.innerHeight || document.documentElement.clientHeight || 0;
                    var barH = 0;
                    if (bottomBarEl) {
                        barH = bottomBarEl.offsetHeight || bottomBarEl.clientHeight || 0;
                    }
                    var bottomMargin = Math.max(barH + 6, 36); // barra compacta en fs
                    var availH = vh - bottomMargin;
                    console.log('[scaleBookToFit] vw=' + vw + ' availH=' + availH + ' barH=' + barH);
                    if (availH < 100 || vw < 100) { stfParent.style.transform = ''; return; }
                    var scaleX = vw / pw;
                    var scaleY = availH / ph;
                    var s = Math.min(scaleX, scaleY);
                    console.log('[scaleBookToFit] scaleX=' + scaleX.toFixed(3) + ' scaleY=' + scaleY.toFixed(3) + ' => s=' + s.toFixed(3));
                    if (s > 1.02) {
                        stfParent.style.transformOrigin = 'top center';
                        stfParent.style.transform = 'scale(' + s.toFixed(4) + ')';
                    } else {
                        stfParent.style.transform = '';
                        stfParent.style.transformOrigin = '';
                    }
                }

                pinActionsTopRight();
                applyBottomBarDocking();
                var numPages = 0; // páginas del libro (puede incluir una página en blanco)
                var pdfPages = 0; // páginas reales del PDF
                var indexToPdfPage = [];
                var pageFlip = null;
                var isAnimating = false;
                var objectUrls = [];
                var controlsBound = false;
                var lastFlipImages = null;
                var lastFlipRatio = null;
                var hideUiTimer = null;
                var savedPageKey = 'cba:guide:last-page:' + (pdfVersion || 'noversion');

                function getSavedPage() {
                    try {
                        var raw = window.localStorage.getItem(savedPageKey) || '';
                        var n = parseInt(raw, 10);
                        if (!Number.isFinite(n) || n < 1) return null;
                        return n;
                    } catch (e) {
                        return null;
                    }
                }

                function savePage(pageNum) {
                    var n = parseInt(String(pageNum || ''), 10);
                    if (!Number.isFinite(n) || n < 1) return;
                    try {
                        window.localStorage.setItem(savedPageKey, String(n));
                    } catch (e) {
                        // ignore
                    }
                }

                function isFullscreenActive() {
                    return !!document.fullscreenElement;
                }

                function clearUiAutohide() {
                    if (hideUiTimer) {
                        window.clearTimeout(hideUiTimer);
                        hideUiTimer = null;
                    }
                }

                function setUiHidden(hidden) {
                    root.classList.toggle('is-fs-ui-hidden', !!hidden && isFullscreenActive());
                }

                function scheduleUiAutohide() {
                    clearUiAutohide();
                    if (!isFullscreenActive()) {
                        setUiHidden(false);
                        return;
                    }
                    hideUiTimer = window.setTimeout(function () {
                        setUiHidden(true);
                    }, 2400);
                }

                function bumpUiVisibility() {
                    setUiHidden(false);
                    scheduleUiAutohide();
                }

                try {
                    var hasPageQuery = false;
                    try {
                        hasPageQuery = !!(new URL(window.location.href)).searchParams.has('page');
                    } catch (e) {
                        hasPageQuery = false;
                    }
                    if (!hasPageQuery) {
                        var savedPage = getSavedPage();
                        if (savedPage) startPageFromServer = savedPage;
                    }
                } catch (e) {
                    // ignore
                }

                // Sonido de pasar página (Web Audio, sin assets externos)
                var audioCtx = null;
                var lastFlipSoundAt = 0;

                function ensureAudioCtx() {
                    if (audioCtx) return audioCtx;
                    var Ctx = window.AudioContext || window.webkitAudioContext;
                    if (!Ctx) return null;
                    try {
                        audioCtx = new Ctx();
                    } catch (e) {
                        audioCtx = null;
                    }
                    return audioCtx;
                }

                function playPageFlipSound() {
                    var now = Date.now();
                    if (now - lastFlipSoundAt < 140) return;
                    lastFlipSoundAt = now;

                    var ctx = ensureAudioCtx();
                    if (!ctx) return;

                    try {
                        // Algunos navegadores requieren reanudar el contexto tras interacción.
                        if (ctx.state === 'suspended') {
                            ctx.resume().catch(function () {});
                        }

                        var duration = 0.11;
                        var sampleRate = ctx.sampleRate;
                        var frameCount = Math.max(1, Math.floor(sampleRate * duration));
                        var buffer = ctx.createBuffer(1, frameCount, sampleRate);
                        var data = buffer.getChannelData(0);

                        // Ruido + envolvente rápida (simula "papel")
                        for (var i = 0; i < frameCount; i++) {
                            var t = i / frameCount;
                            var env = Math.exp(-10 * t);
                            data[i] = (Math.random() * 2 - 1) * env;
                        }

                        var src = ctx.createBufferSource();
                        src.buffer = buffer;

                        var bp = ctx.createBiquadFilter();
                        bp.type = 'bandpass';
                        bp.frequency.value = 1800;
                        bp.Q.value = 0.8;

                        var hp = ctx.createBiquadFilter();
                        hp.type = 'highpass';
                        hp.frequency.value = 650;
                        hp.Q.value = 0.7;

                        var gain = ctx.createGain();
                        var t0 = ctx.currentTime;
                        gain.gain.setValueAtTime(0.0001, t0);
                        gain.gain.exponentialRampToValueAtTime(0.18, t0 + 0.012);
                        gain.gain.exponentialRampToValueAtTime(0.0001, t0 + duration);

                        src.connect(bp);
                        bp.connect(hp);
                        hp.connect(gain);
                        gain.connect(ctx.destination);

                        src.start(t0);
                        src.stop(t0 + duration);
                    } catch (e) {
                        // ignore
                    }
                }

                function showError() {
                    if (errorBox) errorBox.style.display = 'block';
                }

                function showLoading() {
                    if (loadingBox) loadingBox.style.display = 'block';
                    root.setAttribute('aria-busy', 'true');
                }

                function hideLoading() {
                    if (loadingBox) loadingBox.style.display = 'none';
                    root.removeAttribute('aria-busy');
                }

                function cleanupObjectUrls() {
                    for (var i = 0; i < objectUrls.length; i++) {
                        try { URL.revokeObjectURL(objectUrls[i]); } catch (e) {}
                    }
                    objectUrls = [];
                }

                window.addEventListener('beforeunload', cleanupObjectUrls);

                // Cache persistente (cliente) para evitar re-render en cada recarga.
                // Se invalida cuando cambia `pdfVersion` (calculado en backend al subir nuevo PDF).
                var cacheEnabled = !!(pdfVersion && window.indexedDB);
                var cacheId = cacheEnabled ? ('guide:' + pdfVersion) : null;

                function pad4(n) {
                    var s = String(n);
                    while (s.length < 4) s = '0' + s;
                    return s;
                }

                function openCacheDb() {
                    return new Promise(function (resolve, reject) {
                        if (!cacheEnabled) return resolve(null);
                        var req = window.indexedDB.open('cbaGuidePdfCache', 1);
                        req.onupgradeneeded = function () {
                            var db = req.result;
                            if (!db.objectStoreNames.contains('meta')) db.createObjectStore('meta', { keyPath: 'id' });
                            if (!db.objectStoreNames.contains('pages')) db.createObjectStore('pages', { keyPath: 'id' });
                        };
                        req.onsuccess = function () { resolve(req.result); };
                        req.onerror = function () { resolve(null); };
                    });
                }

                function cacheMetaGet(db) {
                    return new Promise(function (resolve) {
                        if (!db || !cacheId) return resolve(null);
                        try {
                            var tx = db.transaction('meta', 'readonly');
                            var req = tx.objectStore('meta').get(cacheId);
                            req.onsuccess = function () { resolve(req.result || null); };
                            req.onerror = function () { resolve(null); };
                        } catch (e) {
                            resolve(null);
                        }
                    });
                }

                function cacheMetaPut(db, meta) {
                    return new Promise(function (resolve) {
                        if (!db || !cacheId) return resolve();
                        try {
                            var tx = db.transaction('meta', 'readwrite');
                            tx.objectStore('meta').put(meta);
                            tx.oncomplete = function () { resolve(); };
                            tx.onerror = function () { resolve(); };
                        } catch (e) {
                            resolve();
                        }
                    });
                }

                function cachePagesGetAll(db) {
                    return new Promise(function (resolve) {
                        if (!db || !cacheId) return resolve([]);
                        try {
                            var tx = db.transaction('pages', 'readonly');
                            var store = tx.objectStore('pages');
                            var range = window.IDBKeyRange.bound(cacheId + ':p', cacheId + ':p\uffff');
                            var req = store.getAll(range);
                            req.onsuccess = function () { resolve(req.result || []); };
                            req.onerror = function () { resolve([]); };
                        } catch (e) {
                            resolve([]);
                        }
                    });
                }

                function cachePagePut(db, pageNumber, blob) {
                    return new Promise(function (resolve) {
                        if (!db || !cacheId || !blob) return resolve();
                        try {
                            var tx = db.transaction('pages', 'readwrite');
                            var id = cacheId + ':p' + pad4(pageNumber);
                            tx.objectStore('pages').put({ id: id, blob: blob });
                            tx.oncomplete = function () { resolve(); };
                            tx.onerror = function () { resolve(); };
                        } catch (e) {
                            resolve();
                        }
                    });
                }

                function setupPdfWorker() {
                    window.pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://unpkg.com/pdfjs-dist@3.11.174/legacy/build/pdf.worker.min.js';
                }

                function clampPage(p) {
                    var x = parseInt(String(p), 10);
                    if (!Number.isFinite(x) || x < 1) x = 1;
                    if (numPages && x > numPages) x = numPages;
                    return x;
                }

                function setButtonDisabled(btn, disabled) {
                    if (!btn) return;
                    btn.disabled = !!disabled;
                    btn.setAttribute('aria-disabled', disabled ? 'true' : 'false');
                }

                function currentPageNumber() {
                    if (!pageFlip) return clampPage(startPageFromServer);
                    var idx = 0;
                    try { idx = pageFlip.getCurrentPageIndex() || 0; } catch (e) { idx = 0; }
                    var orientation = getFlipOrientation();
                    if (orientation === 'landscape') {
                        // En spreads, normalizamos al índice izquierdo para estabilidad.
                        // Con `showCover`, los spreads empiezan en 1 (0 es tapa). Con o sin showCover,
                        // devolvemos el índice de la página izquierda del spread.
                        if (USE_SHOW_COVER) {
                            if (idx > 1 && idx < (numPages ? numPages - 1 : idx + 1) && (idx % 2 === 0)) {
                                idx = Math.max(1, idx - 1);
                            }
                        } else {
                            if (idx % 2 === 1) idx = Math.max(0, idx - 1);
                        }
                    }
                    return idx + 1;
                }

                function updateControls() {
                    var n = currentPageNumber();
                    var pdfN = (indexToPdfPage && indexToPdfPage.length) ? indexToPdfPage[n - 1] : n;
                    var idxNow = 0;
                    if (pageFlip) {
                        try { idxNow = pageFlip.getCurrentPageIndex() || 0; } catch (e) { idxNow = 0; }
                    }
                    setButtonDisabled(prevBtn, !pageFlip || isAnimating || idxNow <= 0);
                    setButtonDisabled(nextBtn, !pageFlip || isAnimating || (numPages ? idxNow >= (numPages - 1) : false));

                    if (pageCountEl) pageCountEl.textContent = pdfPages ? '/ ' + String(pdfPages) : (numPages ? '/ ' + String(numPages) : '/ —');
                    if (pageInputEl) {
                        if (pdfPages) pageInputEl.max = String(pdfPages);
                        else if (numPages) pageInputEl.max = String(numPages);
                        pageInputEl.value = String(pdfN || 1);
                    }
                    if (pageSliderEl) {
                        var maxPage = (pdfPages || numPages || 1);
                        pageSliderEl.max = String(maxPage);
                        pageSliderEl.value = String(pdfN || 1);
                        pageSliderEl.disabled = maxPage <= 1;
                    }
                    if (pageIndicatorEl) {
                        if (!numPages) pageIndicatorEl.textContent = 'Cargando…';
                        else if (!pdfPages) pageIndicatorEl.textContent = 'Página ' + n + ' de ' + numPages;
                        else if (!pdfN) pageIndicatorEl.textContent = 'Página en blanco';
                        else pageIndicatorEl.textContent = 'Página ' + pdfN + ' de ' + pdfPages;
                    }

                    if (pdfN) savePage(pdfN);

                    updateCoverClasses();
                }

                // Tapa/contratapa: solo primera y última como página simple en landscape.
                // Nota: el agrandamiento anterior se debía a que el spread se escalaba hacia abajo,
                // pero la tapa (página simple) no. Lo evitamos calculando `width` como ~mitad del
                // contenedor en layouts anchos.
                var USE_SHOW_COVER = true;

                function updateCoverClasses() {
                    // Dejar que StPageFlip maneje cover/spreads. Evitamos shifts manuales
                    // que pueden desalinear o recortar portada/contraportada.
                    root.classList.remove('is-cover-front', 'is-cover-back', 'is-cover-shift-front', 'is-cover-shift-back');
                    if (!USE_SHOW_COVER) return;

                    var isLandscape = false;
                    try { isLandscape = getFlipOrientation() === 'landscape'; } catch (e) { isLandscape = false; }

                    var idx = 0;
                    if (pageFlip) {
                        try { idx = pageFlip.getCurrentPageIndex(); } catch (e) { idx = 0; }
                    }

                    var isFront = !!(pageFlip && isLandscape && idx === 0);
                    var isBack = !!(pageFlip && isLandscape && numPages && idx === (numPages - 1));

                    root.classList.toggle('is-cover-front', isFront);
                    root.classList.toggle('is-cover-back', isBack);
                }

                function clampPdfPage(p) {
                    var x = parseInt(String(p), 10);
                    if (!Number.isFinite(x) || x < 1) x = 1;
                    if (pdfPages && x > pdfPages) x = pdfPages;
                    return x;
                }

                function findBookPageForPdf(pdfPage) {
                    var n = clampPdfPage(pdfPage);
                    if (!indexToPdfPage || !indexToPdfPage.length) return clampPage(n);
                    var idx = indexToPdfPage.indexOf(n);
                    if (idx < 0) return clampPage(n);
                    return idx + 1;
                }

                function flipToPdfPage(pdfPage) {
                    var bookPage = findBookPageForPdf(pdfPage);
                    flipTo(bookPage);
                }

                function renderPdfPageToImage(pageNumber, targetW, maxH) {
                    if (!pdfDoc) return Promise.resolve({ url: '', blob: null });
                    return pdfDoc.getPage(pageNumber).then(function (page) {
                        var viewport = page.getViewport({ scale: 1 });
                        var scale = targetW / viewport.width;
                        var scaled = page.getViewport({ scale: scale });
                        if (typeof maxH === 'number' && maxH > 0 && scaled.height > maxH) {
                            scale = maxH / viewport.height;
                            scaled = page.getViewport({ scale: scale });
                        }

                        var outputScale = Math.min(2, window.devicePixelRatio || 1);
                        var canvas = document.createElement('canvas');
                        canvas.width = Math.floor(scaled.width * outputScale);
                        canvas.height = Math.floor(scaled.height * outputScale);

                        var ctx = canvas.getContext('2d');
                        ctx.setTransform(outputScale, 0, 0, outputScale, 0, 0);
                        ctx.clearRect(0, 0, scaled.width, scaled.height);

                        return page.render({ canvasContext: ctx, viewport: scaled }).promise.then(function () {
                            return new Promise(function (resolve) {
                                if (!canvas.toBlob) {
                                    resolve({ url: canvas.toDataURL('image/jpeg', 0.92), blob: null });
                                    return;
                                }

                                canvas.toBlob(function (blob) {
                                    if (!blob) {
                                        resolve({ url: canvas.toDataURL('image/jpeg', 0.92), blob: null });
                                        return;
                                    }
                                    var url = URL.createObjectURL(blob);
                                    objectUrls.push(url);
                                    resolve({ url: url, blob: blob });
                                }, 'image/jpeg', 0.92);
                            });
                        });
                    });
                }

                function initFlipbookFromPdfImageUrls(pdfImageUrls, ratio) {
                    // pdfImageUrls: 1..pdfPages (solo páginas reales, sin blancos)
                    pdfPages = Array.isArray(pdfImageUrls) ? pdfImageUrls.length : 0;
                    numPages = pdfPages;
                    startPageFromServer = clampPdfPage(startPageFromServer);
                    updateControls();

                    var images = (pdfImageUrls || []).slice();

                    // Si el PDF tiene páginas impares, insertamos una página en blanco antes de la última
                    // para que la contratapa (última página real) quede como página única con showCover.
                    var insertAt = -1;
                    if (pdfPages > 1 && (pdfPages % 2 === 1)) {
                        insertAt = pdfPages - 1;
                        var blankSvg = '<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="' + String(Math.round(1000 * ratio)) + '"><rect width="100%" height="100%" fill="white"/></svg>';
                        var blankUrl = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(blankSvg);
                        images.splice(images.length - 1, 0, blankUrl);
                    }

                    indexToPdfPage = [];
                    numPages = images.length;

                    for (var i = 0; i < images.length; i++) {
                        var pdfNum = null;
                        if (insertAt >= 0) {
                            if (i < insertAt) pdfNum = i + 1;
                            else if (i === insertAt) pdfNum = null;
                            else pdfNum = i;
                        } else {
                            pdfNum = i + 1;
                        }
                        indexToPdfPage.push(pdfNum);
                    }

                    // En modo canvas la librería no usa nodos HTML por página.
                    book.innerHTML = '';

                    lastFlipImages = images.slice();
                    lastFlipRatio = ratio;

                    createOrRecreateFlipbook({
                        images: images,
                        ratio: ratio,
                        initialPdfPage: startPageFromServer
                    });
                }

                function computeBaseSize(ratio) {
                    var rect = book.getBoundingClientRect();
                    var isWideLayout = false;
                    try {
                        isWideLayout = !!(window.matchMedia && window.matchMedia('(min-width: 980px)').matches);
                    } catch (e) {
                        isWideLayout = false;
                    }

                    var isLandscapeBox = false;
                    try {
                        var rw = rect.width || 0;
                        var rh = rect.height || 0;
                        isLandscapeBox = !!(rw && rh && (rw / rh) > 1.05);
                    } catch (e) {
                        isLandscapeBox = false;
                    }

                    var fsActive = false;
                    try { fsActive = isFullscreenActive(); } catch (e) { fsActive = false; }

                    var denom = (isWideLayout && isLandscapeBox) ? (fsActive ? 1.46 : 1.72) : 1;
                    var availW = Math.floor((rect.width || 900) / denom);
                    var availH = Math.floor(rect.height || 0);
                    var wByH = 0;
                    if (availH > 0 && ratio > 0) wByH = Math.floor(availH / ratio);

                    var desiredW = availW;
                    if (wByH > 0) desiredW = Math.min(desiredW, wByH);

                    var baseW = Math.min(2600, Math.max(320, desiredW));
                    var baseH = Math.min(3600, Math.max(420, Math.floor(baseW * ratio)));

                    // Zoom proporcional: mismo factor para ancho/alto (sin estirar).
                    var zoom = fsActive ? 1.22 : 1.14;
                    baseW = Math.min(2800, Math.floor(baseW * zoom));
                    baseH = Math.min(4000, Math.floor(baseH * zoom));

                    return { w: baseW, h: baseH };
                }

                function createOrRecreateFlipbook(opts) {
                    if (!opts || !opts.images || !opts.images.length || !opts.ratio) {
                        showError();
                        return;
                    }

                    function initInstance(width, height, images, targetPdf, keepIndex) {
                        pageFlip = new window.St.PageFlip(book, {
                            width: width,
                            height: height,
                            size: 'stretch',
                            minWidth: 320,
                            maxWidth: 2200,
                            minHeight: 360,
                            maxHeight: 2800,
                            drawShadow: true,
                            maxShadowOpacity: 0.45,
                            showCover: USE_SHOW_COVER,
                            usePortrait: true,
                            useMouseEvents: true,
                            mobileScrollSupport: true,
                            flippingTime: 620,
                            autoSize: true
                        });

                        pageFlip.on('flip', function () {
                            playPageFlipSound();
                            updateControls();
                        });

                        pageFlip.on('changeState', function (e) {
                            var s = String(e && e.data ? e.data : '');
                            isAnimating = (s === 'flipping');
                            updateControls();
                        });

                        pageFlip.on('changeOrientation', function () {
                            updateControls();
                        });

                        try {
                            pageFlip.loadFromImages(images);
                        } catch (e) {
                            // Si falla el load, mostramos error y abortamos esta instancia.
                            showError();
                            return;
                        }

                        if (!controlsBound) {
                            bindControls();
                            controlsBound = true;
                        }

                        // Restaurar posición en el siguiente tick para evitar estado intermedio
                        // (en algunos navegadores `loadFromImages` aún no terminó de montar).
                        setTimeout(function () {
                            try {
                                if (targetPdf != null) {
                                    flipToPdfPage(targetPdf);
                                } else {
                                    try { pageFlip.turnToPage(keepIndex); } catch (e) {
                                        try { pageFlip.flip(keepIndex, 'top'); } catch (e2) {}
                                    }
                                }
                            } catch (e3) {
                                // no-op
                            }
                            updateControls();
                        }, 0);
                    }

                    function initFallbackSimple(images, ratio, targetPdf, keepIndex) {
                        var rect = book.getBoundingClientRect();
                        var isWideLayout = false;
                        try {
                            isWideLayout = !!(window.matchMedia && window.matchMedia('(min-width: 980px)').matches);
                        } catch (e) {
                            isWideLayout = false;
                        }
                        var fsActive = false;
                        try { fsActive = isFullscreenActive(); } catch (e) { fsActive = false; }
                        var denom = isWideLayout ? (fsActive ? 1.46 : 1.72) : 1;
                        var w = Math.min(2600, Math.max(360, Math.floor((rect.width || 900) / denom)));
                        var h = Math.min(3600, Math.max(460, Math.floor(w * ratio)));
                        var zoom = fsActive ? 1.22 : 1.14;
                        w = Math.min(2800, Math.floor(w * zoom));
                        h = Math.min(4000, Math.floor(h * zoom));
                        initInstance(w, h, images, targetPdf, keepIndex);
                    }

                    var keepIndex = 0;
                    if (pageFlip && pageFlip.getCurrentPageIndex) {
                        try { keepIndex = pageFlip.getCurrentPageIndex() || 0; } catch (e) { keepIndex = 0; }
                    }

                    // Si viene una página PDF explícita, esa manda.
                    var targetPdf = null;
                    if (typeof opts.initialPdfPage === 'number' && Number.isFinite(opts.initialPdfPage)) {
                        targetPdf = clampPdfPage(opts.initialPdfPage);
                    }

                    try {
                        // Intentar destruir instancia anterior si existe.
                        try { if (pageFlip && pageFlip.destroy) pageFlip.destroy(); } catch (e) {}
                        pageFlip = null;
                        isAnimating = false;

                        // Limpiar canvas anterior.
                        book.innerHTML = '';

                        var size = computeBaseSize(opts.ratio);
                        initInstance(size.w, size.h, opts.images, targetPdf, keepIndex);
                    } catch (e) {
                        // Fallback al método anterior (basado en ancho) para no dejar el visor en blanco.
                        try {
                            pageFlip = null;
                            isAnimating = false;
                            book.innerHTML = '';
                            initFallbackSimple(opts.images, opts.ratio, targetPdf, keepIndex);
                        } catch (e2) {
                            showError();
                        }
                    }
                }

                function flipTo(pageNumber) {
                    if (!pageFlip) return;
                    var idx = clampPage(pageNumber) - 1;
                    var orientation = getFlipOrientation();
                    if (orientation === 'landscape') {
                        if (USE_SHOW_COVER) {
                            // Con showCover: 0 tapa, spreads empiezan en 1 (impares), y la contratapa es la última.
                            if (numPages && idx > 1 && idx < (numPages - 1) && (idx % 2 === 0)) {
                                idx = Math.max(1, idx - 1);
                            }
                        } else {
                            // Sin showCover: spreads empiezan en 0 (pares).
                            if (idx % 2 === 1) idx = Math.max(0, idx - 1);
                        }
                    }
                    try {
                        pageFlip.flip(idx, 'top');
                    } catch (e) {
                        try { pageFlip.turnToPage(idx); } catch (e2) {}
                    }
                }

                function getFlipOrientation() {
                    if (!pageFlip || !pageFlip.getOrientation) return 'portrait';
                    try {
                        return String(pageFlip.getOrientation() || 'portrait');
                    } catch (e) {
                        return 'portrait';
                    }
                }

                function computeNextIndex() {
                    if (!pageFlip) return 0;
                    var idx = pageFlip.getCurrentPageIndex ? pageFlip.getCurrentPageIndex() : 0;
                    var orientation = getFlipOrientation();
                    if (orientation !== 'landscape') {
                        var next1 = idx + 1;
                        // Si hay una página en blanco insertada (pdfNum=null), saltarla en portrait.
                        if (indexToPdfPage && indexToPdfPage.length && next1 < indexToPdfPage.length) {
                            if (indexToPdfPage[next1] == null && (next1 + 1) < indexToPdfPage.length) next1 += 1;
                        }
                        if (numPages) next1 = Math.min(numPages - 1, next1);
                        return Math.max(0, next1);
                    }

                    // En landscape avanzamos por spreads. Con showCover, tapa/contratapa son simples.
                    if (USE_SHOW_COVER) {
                        if (idx <= 0) return 1;
                        if (numPages && idx >= numPages - 2) return Math.max(0, numPages - 1);
                    }

                    var left = (idx % 2 === 0) ? Math.max(USE_SHOW_COVER ? 1 : 0, idx - 1) : idx;
                    var next = left + 2;
                    if (numPages) next = Math.min(numPages - 1, next);
                    return Math.max(0, next);
                }

                function computePrevIndex() {
                    if (!pageFlip) return 0;
                    var idx = pageFlip.getCurrentPageIndex ? pageFlip.getCurrentPageIndex() : 0;
                    var orientation = getFlipOrientation();
                    if (orientation !== 'landscape') {
                        var prev1 = Math.max(0, idx - 1);
                        // Si hay una página en blanco insertada (pdfNum=null), saltarla en portrait.
                        if (indexToPdfPage && indexToPdfPage.length && prev1 >= 0) {
                            if (indexToPdfPage[prev1] == null && (prev1 - 1) >= 0) prev1 -= 1;
                        }
                        return Math.max(0, prev1);
                    }

                    if (USE_SHOW_COVER) {
                        if (idx <= 0) return 0;
                        if (idx === 1) return 0;
                    }

                    var left = (idx % 2 === 0) ? Math.max(USE_SHOW_COVER ? 1 : 0, idx - 1) : idx;
                    var prev = left - 2;
                    return Math.max(0, prev);
                }

                function flipPrev() {
                    if (!pageFlip) return;
                    var target = computePrevIndex();
                    try { pageFlip.flip(target, 'top'); } catch (e) {
                        try { pageFlip.turnToPage(target); } catch (e2) {}
                    }
                }

                function flipNext() {
                    if (!pageFlip) return;
                    var target = computeNextIndex();
                    try { pageFlip.flip(target, 'top'); } catch (e) {
                        try { pageFlip.turnToPage(target); } catch (e2) {}
                    }
                }

                function bindControls() {
                    if (prevBtn) prevBtn.addEventListener('click', flipPrev);
                    if (nextBtn) nextBtn.addEventListener('click', flipNext);

                    if (pageInputEl) {
                        pageInputEl.addEventListener('keydown', function (ev) {
                            if (ev.key !== 'Enter') return;
                            ev.preventDefault();
                            flipToPdfPage(parseInt(pageInputEl.value || '1', 10) || 1);
                        });

                        pageInputEl.addEventListener('change', function () {
                            flipToPdfPage(parseInt(pageInputEl.value || '1', 10) || 1);
                        });
                    }

                    if (pageSliderEl) {
                        pageSliderEl.addEventListener('input', function () {
                            flipToPdfPage(parseInt(pageSliderEl.value || '1', 10) || 1);
                        });
                        pageSliderEl.addEventListener('change', function () {
                            flipToPdfPage(parseInt(pageSliderEl.value || '1', 10) || 1);
                        });
                    }

                    function updateFullscreenButton() {
                        if (!fullscreenBtn) return;
                        var active = isFullscreenActive();
                        fullscreenBtn.setAttribute('aria-label', active ? 'Salir de pantalla completa' : 'Pantalla completa');
                        fullscreenBtn.setAttribute('title', active ? 'Salir' : 'Pantalla completa');
                    }

                    if (fullscreenBtn) {
                        fullscreenBtn.addEventListener('click', function () {
                            try {
                                if (!isFullscreenActive()) {
                                    // Usar el propio contenedor del visor evita depender de wrappers
                                    // (por ejemplo en la guía compartida no existe `.guide-main`).
                                    var host = root;
                                    if (host.requestFullscreen) host.requestFullscreen();
                                } else {
                                    if (document.exitFullscreen) document.exitFullscreen();
                                }
                            } catch (e) {
                                // no-op
                            }
                        });
                    }

                    document.addEventListener('fullscreenchange', function () {
                        updateFullscreenButton();
                        setUiHidden(true);
                        pinActionsTopRight();
                        applyBottomBarDocking();

                        // Forzar fondo oscuro via inline styles (CSS no logra ganar a .table-wrapper)
                        if (isFullscreenActive()) {
                            root.style.background = '#1a1a1a';
                            root.style.border = 'none';
                            root.style.boxShadow = 'none';
                            root.style.padding = '0';
                            if (book) {
                                book.style.background = 'transparent';
                                book.style.border = 'none';
                                book.style.boxShadow = 'none';
                            }
                        } else {
                            root.style.background = '';
                            root.style.border = '';
                            root.style.boxShadow = '';
                            root.style.padding = '';
                            if (book) {
                                book.style.background = '';
                                book.style.border = '';
                                book.style.boxShadow = '';
                            }
                        }

                        // Reset scale before StPageFlip recalculates
                        scaleBookToFit();

                        function _looksInvisible() {
                            try {
                                var rect = book ? book.getBoundingClientRect() : null;
                                if (!rect || !rect.width || !rect.height) return true;
                                var c = book.querySelector('canvas');
                                if (c && ((c.width || 0) < 4 || (c.height || 0) < 4)) return true;
                            } catch (e) {
                                return true;
                            }
                            return false;
                        }

                        setTimeout(function () {
                            // Primero intentar actualizar la instancia existente (más estable que destruir).
                            var updated = false;
                            try {
                                if (pageFlip && pageFlip.update) {
                                    pageFlip.update();
                                    updated = true;
                                }
                            } catch (e) {
                                updated = false;
                            }

                            // Si aun así el libro queda en blanco, recrear como plan B.
                            if ((!updated || _looksInvisible()) && lastFlipImages && lastFlipRatio) {
                                createOrRecreateFlipbook({ images: lastFlipImages, ratio: lastFlipRatio });
                            }
                            updateControls();
                            // Escalar para llenar pantalla completa (múltiples intentos para dar tiempo a StPageFlip)
                            setTimeout(scaleBookToFit, 100);
                            setTimeout(scaleBookToFit, 350);
                            setTimeout(scaleBookToFit, 700);
                        }, 120);
                    });
                    updateFullscreenButton();

                    ['mousemove', 'touchmove'].forEach(function (evtName) {
                        root.addEventListener(evtName, function () {
                            bumpUiVisibility();
                        }, { passive: true });
                    });

                    var resizeTimer = null;
                    window.addEventListener('resize', function () {
                        if (!pageFlip) return;
                        if (resizeTimer) window.clearTimeout(resizeTimer);
                        resizeTimer = window.setTimeout(function () {
                            try { pageFlip.update(); } catch (e) {}
                            pinActionsTopRight();
                            applyBottomBarDocking();
                            updateControls();
                            scaleBookToFit();
                        }, 180);
                    });

                    document.addEventListener('keydown', function (ev) {
                        if (!pageFlip) return;
                        if (isAnimating) return;

                        var active = document.activeElement;
                        var tag = active && active.tagName ? active.tagName.toLowerCase() : '';
                        var isTyping = tag === 'input' || tag === 'textarea' || tag === 'select' || (active && active.isContentEditable);
                        if (isTyping) return;

                        if (ev.key === 'ArrowLeft') {
                            ev.preventDefault();
                            flipPrev();
                            return;
                        }
                        if (ev.key === 'ArrowRight') {
                            ev.preventDefault();
                            flipNext();
                            return;
                        }
                        if (ev.key === 'Home') {
                            ev.preventDefault();
                            flipToPdfPage(1);
                            return;
                        }
                        if (ev.key === 'End') {
                            ev.preventDefault();
                            flipToPdfPage(pdfPages || (numPages || 1));
                        }
                    });
                }

                showLoading();

                Promise.all([
                    waitFor(function () { return !!window.pdfjsLib; }, 35, 120),
                    waitFor(function () { return !!(window.St && window.St.PageFlip); }, 35, 120)
                ]).then(function () {
                    try { setupPdfWorker(); } catch (e) {}

                    function loadPdfWithFallback(url) {
                        // Si el worker (CDN) está bloqueado o falla, PDF.js puede explotar.
                        // Reintentamos sin worker para que el “libro” siga funcionando.
                        try {
                            return window.pdfjsLib.getDocument({ url: url }).promise.catch(function () {
                                return window.pdfjsLib.getDocument({ url: url, disableWorker: true }).promise;
                            });
                        } catch (e) {
                            try {
                                return window.pdfjsLib.getDocument({ url: url, disableWorker: true }).promise;
                            } catch (e2) {
                                return Promise.reject(e2);
                            }
                        }
                    }

                    // 1) Intentar cargar desde cache (IndexedDB)
                    return openCacheDb().then(function (db) {
                        return cacheMetaGet(db).then(function (meta) {
                            if (!db || !meta || !meta.pdfPages || !meta.ratio) return null;
                            return cachePagesGetAll(db).then(function (records) {
                                var expected = parseInt(meta.pdfPages, 10) || 0;
                                if (!expected || !Array.isArray(records) || records.length < expected) return null;

                                cleanupObjectUrls();

                                var urls = [];
                                for (var i = 0; i < expected; i++) {
                                    var rec = records[i];
                                    if (!rec || !rec.blob) return null;
                                    var u = URL.createObjectURL(rec.blob);
                                    objectUrls.push(u);
                                    urls.push(u);
                                }

                                return { urls: urls, pdfPages: expected, ratio: meta.ratio };
                            });
                        }).then(function (cached) {
                            if (cached) {
                                pdfPages = cached.pdfPages;
                                initFlipbookFromPdfImageUrls(cached.urls, cached.ratio);
                                return true;
                            }
                            return false;
                        }).then(function (usedCache) {
                            if (usedCache) return;

                            // 2) Si no hay cache, renderizar con PDF.js y guardar blobs
                            return loadPdfWithFallback(pdfUrl).then(function (doc) {
                                pdfDoc = doc;
                                pdfPages = doc.numPages || 0;
                                startPageFromServer = clampPdfPage(startPageFromServer);
                                updateControls();

                                return pdfDoc.getPage(1).then(function (firstPage) {
                                    var v = firstPage.getViewport({ scale: 1 });
                                    var ratio = v.height / v.width;

                                    if (pageIndicatorEl && pdfPages) pageIndicatorEl.textContent = 'Preparando…';

                                    cleanupObjectUrls();

                                    return openCacheDb().then(function (db2) {
                                        var meta = { id: cacheId, pdfPages: pdfPages, ratio: ratio, savedAt: Date.now() };
                                        return cacheMetaPut(db2, meta).then(function () {
                                            var imgW = 2200;
                                            var maxH = 3200;
                                            var urls = [];

                                            var seq = Promise.resolve();
                                            for (var p = 1; p <= pdfPages; p++) {
                                                (function (pageNumber) {
                                                    seq = seq.then(function () {
                                                        if (pageIndicatorEl && pdfPages) {
                                                            pageIndicatorEl.textContent = 'Renderizando ' + pageNumber + ' de ' + pdfPages + '…';
                                                        }
                                                        return renderPdfPageToImage(pageNumber, imgW, maxH).then(function (imgRes) {
                                                            if (imgRes && imgRes.blob) {
                                                                return cachePagePut(db2, pageNumber, imgRes.blob).then(function () {
                                                                    urls.push(imgRes.url);
                                                                });
                                                            }
                                                            urls.push(imgRes && imgRes.url ? imgRes.url : '');
                                                        });
                                                    });
                                                })(p);
                                            }

                                            return seq.then(function () {
                                                initFlipbookFromPdfImageUrls(urls, ratio);
                                            });
                                        });
                                    });
                                });
                            });
                        });
                    });
                }).catch(function () {
                    showError();
                }).finally(function () {
                    hideLoading();
                    updateControls();
                });
            });
        })();
    </script>
